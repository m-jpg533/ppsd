<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎵 翻牌名曲牆</title>

<style>
body{
  margin:0;
  background:#000;
  font-family:"Microsoft JhengHei",sans-serif;
  color:#fff;
  display:flex;
  justify-content:center;
}

.wall{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  padding:30px;
  width:100%;
  max-width:1100px;
}

.card{
  perspective:1000px;
}

.card-inner{
  width:100%;
  padding-top:56.25%;
  position:relative;
  transform-style:preserve-3d;
  transition:transform 0.8s;
  cursor:pointer;
}

.card.flip .card-inner{
  transform:rotateY(180deg);
}

.face{
  position:absolute;
  inset:0;
  border-radius:16px;
  backface-visibility:hidden;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}

.front{
  background:linear-gradient(135deg,#222,#000);
  border:1px solid #333;
  flex-direction:column;
}

.front h3{
  margin:10px 0 0;
  font-size:16px;
}

.play{
  font-size:40px;
  opacity:.8;
}

.back{
  background:#000;
  transform:rotateY(180deg);
}

iframe{
  width:100%;
  height:100%;
  border:none;
}
</style>
</head>

<body>

<div class="wall">

  <!-- 卡片 1 -->
  <div class="card" onclick="play(this,'llXoJZyfySg')">
    <div class="card-inner">
      <div class="face front">
        <div class="play">▶</div>
        <h3>名曲一</h3>
      </div>
      <div class="face back"></div>
    </div>
  </div>

  <!-- 卡片 2 -->
  <div class="card" onclick="play(this,'s8qTWtrTUVk')">
    <div class="card-inner">
      <div class="face front">
        <div class="play">▶</div>
        <h3>名曲二</h3>
      </div>
      <div class="face back"></div>
    </div>
  </div>

  <!-- 卡片 3 -->
  <div class="card" onclick="play(this,'FFnzZONzKLA')">
    <div class="card-inner">
      <div class="face front">
        <div class="play">▶</div>
        <h3>名曲三</h3>
      </div>
      <div class="face back"></div>
    </div>
  </div>

</div>

<script>
function play(card,id){
  if(card.classList.contains("flip")) return;

  card.classList.add("flip");
  const back = card.querySelector(".back");
  back.innerHTML = `
    <iframe 
      src="https://www.youtube.com/embed/${id}?autoplay=1&rel=0"
      allow="autoplay; encrypted-media"
      allowfullscreen>
    </iframe>
  `;
}
</script>

</body>
</html>
