 <!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shorts 科幻首頁</title>

<style>
body{
  margin:0;
  background:#000;
  font-family:"Microsoft JhengHei",sans-serif;
  color:#fff;
}

/* Shorts 列表 */
.shorts{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:12px;
  padding:16px;
}

.short{
  position:relative;
  border-radius:14px;
  overflow:hidden;
  cursor:pointer;
}

.short img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.playIcon{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:36px;
  background:rgba(0,0,0,.35);
}

/* 播放器 */
#playerBox{
  position:fixed;
  inset:0;
  background:#000;
  display:none;
  z-index:9999;
}

#player{
  width:100%;
  height:100%;
  border:none;
}

#closeBtn{
  position:absolute;
  top:12px;
  right:12px;
  font-size:20px;
  background:rgba(0,0,0,.6);
  color:#fff;
  border:none;
  border-radius:50%;
  width:36px;
  height:36px;
}
</style>
</head>

<body>

<!-- Shorts -->
<div class="shorts">
  <div class="short" onclick="playShort('jSaRUPIsDIA')">
    <img src="https://img.youtube.com/vi/jSaRUPIsDIA/hqdefault.jpg">
    <div class="playIcon">▶</div>
  </div>

  <div class="short" onclick="playShort('bKe8eohEfTQ')">
    <img src="https://img.youtube.com/vi/bKe8eohEfTQ/hqdefault.jpg">
    <div class="playIcon">▶</div>
  </div>
</div>

<!-- 播放器 -->
<div id="playerBox">
  <iframe
    id="player"
    allow="encrypted-media"
    playsinline
    webkit-playsinline>
  </iframe>
  <button id="closeBtn" onclick="closePlayer()">✕</button>
</div>

<script>
function playShort(id){
  const box = document.getElementById("playerBox");
  const player = document.getElementById("player");

  // ✅ 無 autoplay、無 mute（手機一定有聲）
  player.src = `https://www.youtube.com/embed/${id}?playsinline=1`;

  box.style.display = "block";
}

function closePlayer(){
  const box = document.getElementById("playerBox");
  const player = document.getElementById("player");

  player.src = "";
  box.style.display = "none";
}
</script>

</body>
</html>
