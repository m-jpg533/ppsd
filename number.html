<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>框框數學遊戲</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Microsoft JhengHei",Arial,sans-serif;background:linear-gradient(135deg,#dff6ff,#fff7df);display:flex;justify-content:center;align-items:center;padding:20px}
.game{width:min(680px,100%);background:#fff;border-radius:28px;padding:30px 24px;text-align:center;box-shadow:0 12px 35px rgba(0,0,0,.15)}
h1{margin:0 0 10px;font-size:34px}.subtitle{color:#666;margin-bottom:20px}
.info{display:flex;gap:12px;margin-bottom:22px}.badge{flex:1;background:#f3f5f7;border-radius:15px;padding:12px;font-size:18px;font-weight:bold}
.question{font-size:clamp(30px,7vw,54px);font-weight:bold;padding:28px 10px;margin:10px 0 22px;background:#f8fbff;border:3px dashed #8bbbd4;border-radius:22px}
.answer{width:min(300px,80%);padding:15px;font-size:28px;text-align:center;border:3px solid #bbb;border-radius:15px;outline:none}.answer:focus{border-color:#4a90e2}
button{border:0;border-radius:15px;padding:14px 25px;font-size:20px;font-weight:bold;cursor:pointer;margin:12px 5px 0}.check{background:#4a90e2;color:#fff}.next{background:#35a66f;color:#fff}
.message{min-height:42px;margin-top:18px;font-size:22px;font-weight:bold}.hint{color:#777;margin-top:8px;font-size:16px}
</style>
</head>
<body>
<div class="game">
<h1>🧩 框框數學遊戲</h1>
<div class="subtitle">兩個框框代表同一個數字，請找出答案！</div>
<div class="info">
<div class="badge">題目：<span id="round">1</span></div>
<div class="badge">分數：<span id="score">0</span></div>
</div>
<div class="question" id="question"></div>
<input id="answer" class="answer" type="number" inputmode="decimal" placeholder="輸入答案" autocomplete="off">
<div>
<button class="check" onclick="checkAnswer()">✅ 送出答案</button>
<button class="next" onclick="newQuestion()">➡️ 下一題</button>
</div>
<div class="message" id="message"></div>
<div class="hint">提示：把「□」想成 X，再解方程式。</div>
</div>

<script>
const questions=[
{d:2,s:10,a:20},{d:3,s:12,a:18},{d:4,s:15,a:20},
{d:5,s:36,a:45},{d:6,s:30,a:36},{d:5,s:20,a:25},
{d:4,s:24,a:32},{d:3,s:18,a:27},{d:5,s:12.5,a:15.625},
{d:8,s:14,a:16}
];
let currentAnswer=45,score=0,round=1,answered=false,last=-1;

function makeQuestion(){
 let i;
 do{i=Math.floor(Math.random()*questions.length)}while(i===last);
 last=i;
 const q=questions[i];
 currentAnswer=q.a;
 document.getElementById("question").textContent=`□ ÷ ${q.d} = □ − ${q.s}`;
 document.getElementById("answer").value="";
 document.getElementById("message").textContent="";
 answered=false;
 document.getElementById("answer").focus();
}
function checkAnswer(){
 if(answered)return;
 const el=document.getElementById("answer");
 if(el.value.trim()===""){document.getElementById("message").textContent="請先輸入答案！";return}
 const value=Number(el.value);
 if(Math.abs(value-currentAnswer)<0.0001){
  score+=10;document.getElementById("score").textContent=score;
  document.getElementById("message").textContent="🎉 答對了！太棒了！";
  answered=true;
 }else{
  document.getElementById("message").textContent="❌ 答錯了，再想一下！";
 }
}
function newQuestion(){
 round++;document.getElementById("round").textContent=round;makeQuestion();
}
document.getElementById("answer").addEventListener("keydown",e=>{if(e.key==="Enter")checkAnswer()});
makeQuestion();
</script>
</body>
</html>
