
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>GPS 上傳</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<h2>上傳你的 GPS 位置</h2>
<button onclick="sendLocation()">傳送位置</button>
<p id="status"></p>

<script>
function sendLocation() {
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(pos) {
            fetch("/update_location", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    lat: pos.coords.latitude,
                    lon: pos.coords.longitude
                })
            }).then(r => r.json())
            .then(data => {
                document.getElementById("status").innerText = "傳送結果：" + JSON.stringify(data);
            });
        }, function(err){
            document.getElementById("status").innerText = "無法取得 GPS: " + err.message;
        });
    } else {
        document.getElementById("status").innerText = "裝置不支援定位";
    }
}
</script>
</body>
</html>
