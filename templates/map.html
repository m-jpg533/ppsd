
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>即時位置</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html, body { margin:0; height:100%; }
#map { height:100vh; width:100%; }
#info { position:absolute; top:5px; left:5px; background:white; padding:5px; z-index:5; }
</style>
<script src="https://maps.googleapis.com/maps/api/js"></script>
</head>
<body>
<div id="info">最後更新時間：</div>
<div id="map"></div>

<script>
let map, marker;

function init() {
    map = new google.maps.Map(document.getElementById("map"), {
        zoom: 16,
        center: {lat: 25.0330, lng: 121.5654}
    });

    marker = new google.maps.Marker({
        position: {lat: 25.0330, lng: 121.5654},
        map: map
    });

    updateLocation();
    setInterval(updateLocation, 3000);
}

function updateLocation() {
    fetch("/latest")
    .then(r => r.json())
    .then(data => {
        if (data.lat && data.lon) {
            const pos = {lat: data.lat, lng: data.lon};
            marker.setPosition(pos);
            map.panTo(pos);
            document.getElementById("info").innerText = "最後更新時間：" + (data.time || "未更新");
        }
    }).catch(err => console.log(err));
}

init();
</script>
</body>
</html>
