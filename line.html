<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>極簡動感計步器 - 跨平台步數追蹤</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 圖標 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- QR Code 生成庫 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        .gradient-bg {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .pulse-ring {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 0.4; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
    </style>
</head>
<body class="gradient-bg min-h-screen text-slate-100 flex flex-col justify-between p-4 sm:p-6 max-w-md mx-auto">

    <!-- 頂部標題列 -->
    <header class="flex justify-between items-center py-3 border-b border-slate-800">
        <div class="flex items-center space-x-2">
            <div class="w-9 h-9 rounded-xl bg-indigo-500/20 border border-indigo-400/30 flex items-center justify-center text-indigo-400">
                <i class="fa-solid fa-person-walking text-lg"></i>
            </div>
            <div>
                <h1 class="text-base font-bold leading-none tracking-wide text-white">LINE 步數連線</h1>
                <span class="text-xs text-slate-400">極簡動感計步器</span>
            </div>
        </div>
        <button onclick="toggleSettingsModal()" class="w-9 h-9 rounded-xl bg-slate-800/80 hover:bg-slate-700 flex items-center justify-center text-slate-300 transition">
            <i class="fa-solid fa-sliders"></i>
        </button>
    </header>

    <!-- 主要內容區 -->
    <main class="my-auto py-6 flex flex-col items-center justify-center">

        <!-- 步數圓形進度環 -->
        <div class="relative w-64 h-64 sm:w-72 sm:h-72 flex items-center justify-center my-4">
            <!-- 外圍光暈發光層 -->
            <div id="glowRing" class="absolute inset-0 rounded-full bg-indigo-500/10 blur-xl transition-all duration-500"></div>

            <!-- SVG 進度條 -->
            <svg class="w-full h-full transform -rotate-90">
                <circle cx="50%" cy="50%" r="42%" class="stroke-slate-800" stroke-width="12" fill="transparent" />
                <circle id="progressCircle" cx="50%" cy="50%" r="42%" 
                        class="stroke-indigo-500 transition-all duration-300 stroke-dashoffset" 
                        stroke-width="12" 
                        stroke-linecap="round" 
                        fill="transparent" 
                        stroke-dasharray="700" 
                        stroke-dashoffset="700" />
            </svg>

            <!-- 核心步數數據中心 -->
            <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
                <span id="walkingStatus" class="text-xs font-semibold tracking-wider text-emerald-400 uppercase px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 mb-1">
                    <i class="fa-solid fa-circle-dot text-[10px] animate-pulse mr-1"></i>感測中
                </span>
                
                <div class="flex items-baseline justify-center">
                    <span id="stepCount" class="text-5xl sm:text-6xl font-extrabold tracking-tight text-white font-mono">0</span>
                    <span class="text-sm font-semibold text-slate-400 ml-1">步</span>
                </div>

                <div class="mt-2 text-xs text-slate-400 flex items-center space-x-1">
                    <span>目標:</span>
                    <span id="targetStepsDisplay" class="font-bold text-slate-200">10,000</span>
                    <span id="progressPercent" class="text-indigo-400 font-bold ml-1">(0%)</span>
                </div>
            </div>
        </div>

        <!-- 數據統計小面板 (距離、熱量、時間) -->
        <div class="w-full grid grid-cols-3 gap-3 mt-4">
            <div class="glass-card rounded-2xl p-3 text-center">
                <div class="text-xs text-slate-400 mb-1 flex items-center justify-center space-x-1">
                    <i class="fa-solid fa-fire text-amber-400"></i>
                    <span>熱量</span>
                </div>
                <div class="text-lg font-bold text-slate-100"><span id="caloriesText">0</span> <span class="text-xs font-normal text-slate-400">kcal</span></div>
            </div>
            
            <div class="glass-card rounded-2xl p-3 text-center">
                <div class="text-xs text-slate-400 mb-1 flex items-center justify-center space-x-1">
                    <i class="fa-solid fa-route text-sky-400"></i>
                    <span>里程</span>
                </div>
                <div class="text-lg font-bold text-slate-100"><span id="distanceText">0.00</span> <span class="text-xs font-normal text-slate-400">km</span></div>
            </div>

            <div class="glass-card rounded-2xl p-3 text-center">
                <div class="text-xs text-slate-400 mb-1 flex items-center justify-center space-x-1">
                    <i class="fa-solid fa-clock text-emerald-400"></i>
                    <span>時間</span>
                </div>
                <div class="text-lg font-bold text-slate-100"><span id="activeTimeText">0</span> <span class="text-xs font-normal text-slate-400">分鐘</span></div>
            </div>
        </div>

        <!-- 開啟感測器與控制按鈕 -->
        <div class="w-full space-y-3 mt-6">
            <button id="permissionBtn" onclick="requestMotionPermission()" class="w-full py-3.5 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl shadow-lg shadow-indigo-600/30 flex items-center justify-center space-x-2 transition active:scale-[0.98]">
                <i class="fa-solid fa-mobile-screen-button"></i>
                <span>啟用手機感測計步</span>
            </button>

            <div class="flex space-x-3">
                <button onclick="addManualStep(100)" class="flex-1 py-2.5 px-3 glass-card hover:bg-white/10 text-xs font-semibold text-slate-300 rounded-xl transition flex items-center justify-center space-x-1">
                    <i class="fa-solid fa-plus text-indigo-400"></i>
                    <span>模擬+100步</span>
                </button>
                <button onclick="resetSteps()" class="py-2.5 px-4 glass-card hover:bg-rose-500/20 text-xs font-semibold text-rose-400 border-rose-500/20 rounded-xl transition flex items-center justify-center">
                    <i class="fa-solid fa-rotate-left mr-1"></i>重設
                </button>
            </div>
            
            <!-- 新增：即時除錯日誌面板 -->
            <div id="debugBox" class="w-full p-3 bg-slate-950/80 rounded-xl border border-slate-800 text-[11px] font-mono text-slate-400 break-all hidden">
                <div class="text-amber-400 font-bold mb-1 flex justify-between">
                    <span><i class="fa-solid fa-bug mr-1"></i>感測器除錯日誌:</span>
                    <span id="protocolText" class="text-xs"></span>
                </div>
                <div id="debugLog">等待點擊啟用...</div>
            </div>
        </div>

    </main>

    <!-- 底部 LINE 分享區 -->
    <footer class="pt-4 border-t border-slate-800/80">
        <button onclick="shareToLine()" class="w-full py-3.5 px-4 bg-[#06C755] hover:bg-[#05b34c] text-white font-bold rounded-xl shadow-lg shadow-green-600/20 flex items-center justify-center space-x-2 transition active:scale-[0.98]">
            <i class="fa-brands fa-line text-xl"></i>
            <span>分享今日成果到 LINE</span>
        </button>
        
        <div class="flex justify-between items-center mt-3 text-[11px] text-slate-500">
            <span>連結即時同步，朋友開啟即可直接使用</span>
            <button onclick="showQRCodeModal()" class="text-slate-400 underline hover:text-indigo-400">開啟 QR Code</button>
        </div>
    </footer>

    <!-- 設定 Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="glass-card bg-slate-900/90 border-slate-700 w-full max-w-sm rounded-2xl p-6 shadow-2xl">
            <h3 class="text-lg font-bold text-white mb-4 flex items-center justify-between">
                <span><i class="fa-solid fa-sliders text-indigo-400 mr-2"></i>計步參數設定</span>
                <button onclick="toggleSettingsModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </h3>

            <div class="space-y-4 text-sm">
                <div>
                    <label class="block text-slate-300 text-xs font-semibold mb-1">每日目標步數</label>
                    <input type="number" id="targetStepsInput" value="10000" step="500" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white font-mono focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-slate-300 text-xs font-semibold mb-1">體重 (kg) - 計算卡路里</label>
                    <input type="number" id="weightInput" value="65" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white font-mono focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-slate-300 text-xs font-semibold mb-1">步幅 (cm) - 計算步行距離</label>
                    <input type="number" id="strideInput" value="65" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white font-mono focus:outline-none focus:border-indigo-500">
                </div>
            </div>

            <button onclick="saveSettings()" class="w-full mt-6 py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl transition">
                儲存設定
            </button>
        </div>
    </div>

    <!-- QR Code Modal -->
    <div id="qrModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="glass-card bg-slate-900/90 border-slate-700 w-full max-w-xs rounded-2xl p-6 text-center shadow-2xl">
            <h3 class="text-base font-bold text-white mb-2">掃描 QR Code 立即開啟計步</h3>
            <p class="text-xs text-slate-400 mb-4">其他人掃描此條碼亦可開始記錄步數</p>
            
            <div class="bg-white p-3 rounded-xl inline-block mb-4" id="qrcode"></div>

            <button onclick="hideQRCodeModal()" class="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-semibold rounded-xl transition">
                關閉窗口
            </button>
        </div>
    </div>

    <!-- 通知訊息 Toast -->
    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 bg-indigo-600 text-white px-4 py-2 rounded-xl text-xs font-semibold shadow-xl opacity-0 pointer-events-none transition-all duration-300 z-50 flex items-center space-x-2">
        <i class="fa-solid fa-circle-check"></i>
        <span id="toastMsg">訊息通知</span>
    </div>

    <script>
        // 核心狀態變數
        let stepCount = 0;
        let targetSteps = 10000;
        let userWeight = 65; // kg
        let userStride = 65; // cm
        let activeMinutes = 0;

        // 感測器過濾參數
        let lastAccel = { x: 0, y: 0, z: 0 };
        let lastStepTime = 0;
        const stepThreshold = 11.5; // 搖晃加速度閾值
        const stepMinInterval = 330; // 最小步數間隔時間 (ms)
        let isSensored = false;

        // 除錯 Log 輸出
        function logDebug(msg) {
            const box = document.getElementById('debugBox');
            const log = document.getElementById('debugLog');
            box.classList.remove('hidden');
            log.innerHTML = `[${new Date().toLocaleTimeString()}] ${msg}<br>` + log.innerHTML;
        }

        // 初始化頁面
        window.onload = function() {
            updateUI();
            checkMotionPermissionRequirement();
            
            document.getElementById('protocolText').innerText = location.protocol;
            if (window.self !== window.top) {
                logDebug('⚠️ 警告：目前處於 iframe 嵌入頁面中，手機可能會封鎖感測器存取！請在獨立頁面開啟。');
            }

            // 自動計時運動分鐘 (每滿50步算1分鐘)
            setInterval(() => {
                activeMinutes = Math.floor(stepCount / 65);
                document.getElementById('activeTimeText').innerText = activeMinutes;
            }, 5000);
        };

        // 要求動態感測權限 (適用 iOS 13+)
        function requestMotionPermission() {
            logDebug('嘗試請求 DeviceMotion 權限...');
            
            if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
                logDebug('❌ 失敗：非 HTTPS 連線，手機瀏覽器已強制封鎖感測器 API！');
                showToast('⚠️ 請使用 HTTPS 安全連線開啟網頁！');
                return;
            }

            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                DeviceMotionEvent.requestPermission()
                    .then(response => {
                        logDebug(`iOS 授權結果: ${response}`);
                        if (response === 'granted') {
                            startPedometer();
                        } else {
                            logDebug('❌ 使用者拒絕了感測器存取權限');
                            showToast('權限被拒絕，無法讀取加速度計');
                        }
                    })
                    .catch(err => {
                        logDebug(`❌ 請求權限發生錯誤: ${err.message || err}`);
                        startPedometer(); 
                    });
            } else {
                logDebug('非 iOS 13+ 裝置，直接啟動感測器監聽...');
                startPedometer();
            }
        }

        // 啟動步數感測器
        function startPedometer() {
            if (window.DeviceMotionEvent) {
                window.addEventListener('devicemotion', handleMotion, false);
                isSensored = true;
                
                const btn = document.getElementById('permissionBtn');
                btn.classList.remove('bg-indigo-600', 'hover:bg-indigo-500');
                btn.classList.add('bg-emerald-600/80', 'text-white');
                btn.innerHTML = '<i class="fa-solid fa-circle-check mr-1"></i> 已成功啟用手機感測計步';
                
                logDebug('✅ 已成功註冊 devicemotion 事件，請搖晃手機測試');
                showToast('感測器已啟動！請將手機放入口袋或拿在手中 walking');
            } else {
                logDebug('❌ 瀏覽器完全不支援 DeviceMotionEvent');
                showToast('您的裝置不支援 DeviceMotion 感測器');
            }
        }

        // 處理感測器數據 (搖晃/走路演算法)
        function handleMotion(event) {
            const acc = event.accelerationIncludingGravity;
            if (!acc || acc.x === null) {
                logDebug('⚠️ 收到 devicemotion 事件，但加速度數據為 null');
                return;
            }

            const now = Date.now();
            const deltaX = acc.x - lastAccel.x;
            const deltaY = acc.y - lastAccel.y;
            const deltaZ = acc.z - lastAccel.z;

            // 計算三軸綜合加速度向量長度
            const speed = Math.sqrt(deltaX * deltaX + deltaY * deltaY + deltaZ * deltaZ);

            if (speed > stepThreshold) {
                if (now - lastStepTime > stepMinInterval) {
                    stepCount++;
                    lastStepTime = now;
                    updateUI();
                    logDebug(`🚶 偵測到步伐！當前步數: ${stepCount} (加速度強度: ${speed.toFixed(1)})`);
                }
            }

            lastAccel = { x: acc.x, y: acc.y, z: acc.z };
        }

        // 手動模擬加步數
        function addManualStep(count) {
            stepCount += count;
            updateUI();
            showToast(`已手動增加 ${count} 步`);
        }

        // 重置步數
        function resetSteps() {
            stepCount = 0;
            updateUI();
            showToast('步數已清零');
        }

        // 更新介面數值與進度條
        function updateUI() {
            // 步數數字
            document.getElementById('stepCount').innerText = stepCount.toLocaleString();

            // 卡路里估算 (每步約 0.04 kcal，可依體重調整)
            const calories = Math.round(stepCount * (userWeight / 65) * 0.04);
            document.getElementById('caloriesText').innerText = calories;

            // 步行公里數 (步數 * 步幅 cm / 100000)
            const distance = ((stepCount * userStride) / 100000).toFixed(2);
            document.getElementById('distanceText').innerText = distance;

            // 進度百分比計算
            const percent = Math.min(Math.round((stepCount / targetSteps) * 100), 100);
            document.getElementById('progressPercent').innerText = `(${percent}%)`;
            document.getElementById('targetStepsDisplay').innerText = targetSteps.toLocaleString();

            // 更新 SVG 圓形進度條 dashoffset
            const circle = document.getElementById('progressCircle');
            const circumference = 2 * Math.PI * (288 * 0.42); // 周長約 760
            const offset = circumference - (percent / 100) * circumference;
            circle.style.strokeDasharray = `${circumference}`;
            circle.style.strokeDashoffset = offset;

            // 達成目標光暈效果
            const glow = document.getElementById('glowRing');
            if (percent >= 100) {
                glow.className = "absolute inset-0 rounded-full bg-emerald-500/30 blur-2xl pulse-ring transition-all duration-500";
            } else {
                glow.className = "absolute inset-0 rounded-full bg-indigo-500/10 blur-xl transition-all duration-500";
            }
        }

        // 分享到 LINE
        function shareToLine() {
            const currentUrl = window.location.href;
            const distance = ((stepCount * userStride) / 100000).toFixed(2);
            const calories = Math.round(stepCount * (userWeight / 65) * 0.04);
            
            // 組裝分享文字
            const shareText = `🚶‍♂️ 我今天已經走了 ${stepCount.toLocaleString()} 步！\n` +
                              `🛣️ 累積距離：${distance} km\n` +
                              `🔥 消耗熱量：${calories} kcal\n\n` +
                              `點擊下方連結，一起開始走路計步吧👇`;

            // LINE 分享 URL Scheme
            const lineShareUrl = `https://line.me/R/msg/text/?${encodeURIComponent(shareText + "\n" + currentUrl)}`;

            // 打開 LINE
            window.location.href = lineShareUrl;
        }

        // 彈出/隱藏設定視窗
        function toggleSettingsModal() {
            const modal = document.getElementById('settingsModal');
            modal.classList.toggle('hidden');
        }

        // 儲存設定
        function saveSettings() {
            const t = parseInt(document.getElementById('targetStepsInput').value) || 10000;
            const w = parseInt(document.getElementById('weightInput').value) || 65;
            const s = parseInt(document.getElementById('strideInput').value) || 65;

            targetSteps = t;
            userWeight = w;
            userStride = s;

            updateUI();
            toggleSettingsModal();
            showToast('設定已更新');
        }

        // QR Code Modal 控制
        function showQRCodeModal() {
            const modal = document.getElementById('qrModal');
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = ''; // 清空舊 QR
            
            new QRCode(qrContainer, {
                text: window.location.href,
                width: 180,
                height: 180,
                colorDark : "#0f172a",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });

            modal.classList.remove('hidden');
        }

        function hideQRCodeModal() {
            document.getElementById('qrModal').classList.add('hidden');
        }

        // 簡短提示訊息框
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 3000);
        }

        // 檢查瀏覽器與 iOS 權限需求
        function checkMotionPermissionRequirement() {
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                document.getElementById('permissionBtn').classList.add('animate-bounce');
            }
        }
    </script>
</body>
</html>
