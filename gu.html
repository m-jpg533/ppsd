<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多首影片音樂牆</title>

<style>
body{
  margin:0;
  height:100vh;
  background:
    linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.6)),
    url("https://images.unsplash.com/photo-1519681393784-d120267933ba");
  background-size:cover;
  background-position:center;
  font-family:"Microsoft JhengHei",sans-serif;
  overflow:hidden;
  color:white;
}

/* ===== 主播放區 ===== */
.player{
  height:70vh;
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* ===== 雙層彩色圈（同心） ===== */
.ring{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  border-radius:50%;
  animation:spin linear infinite;
}

.outer{
  width:420px;
  height:420px;
  background:conic-gradient(#ff0080,#00ffff,#ffcc00,#ff0080);
  filter:blur(14px);
  animation-duration:10s;
}

.inner{
  width:360px;
  height:360px;
  background:conic-gradient(#00ffcc,#cc00ff,#00ffcc);
  filter:blur(8px);
  animation-duration:4s;
}

.pulse{
  animation:pulse 1.1s ease-in-out infinite;
}

@keyframes spin{
  from{transform:translate(-50%,-50%) rotate(0deg)}
  to{transform:translate(-50%,-50%) rotate(360deg)}
}
@keyframes pulse{
  0%{scale:1}
  50%{scale:1.06}
  100%{scale:1}
}

/* ===== 影片容器（真正置中） ===== */
.video-box{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:260px;
  height:260px;
  z-index:5;
}

.video-box iframe{
  width:100%;
  height:100%;
  border:none;
  border-radius:18px;
  background:black;
  opacity:0;
  transition:opacity .6s;
}
.video-box iframe.show{opacity:1}

/* ===== 名曲牆 ===== */
.list{
  height:30vh;
  display:flex;
  gap:16px;
  padding:20px;
  overflow-x:auto;
}

.card{
  min-width:200px;
  background:rgba(255,255,255,.08);
  border-radius:14px;
  padding:12px;
  cursor:pointer;
  transition:.3s;
}
.card:hover{
  background:rgba(255,255,255,.18);
  transform:scale(1.05);
}
</style>
</head>

<body>

<div class="player">
  <div class="ring outer pulse"></div>
  <div class="ring inner pulse"></div>

  <div class="video-box">
    <iframe id="yt"
      allow="autoplay; encrypted-media"
      allowfullscreen>
    </iframe>
  </div>
</div>

<div class="list" id="list"></div>

<script>
const videos=[
  {title:"✨《家鄉的晚風", id:"s8qTWtrTUVk"},
  {title:"享受 AI 讓人回想起過去的美好時光", id:"FFnzZONzKLA"},
  {title:"傷感情歌《秋風無情", id:"UrLu2vg8MVI"}
];

const yt=document.getElementById("yt");
const list=document.getElementById("list");
let index=0;

function playVideo(i){
  yt.classList.remove("show");
  setTimeout(()=>{
    yt.src=`https://www.youtube.com/embed/${videos[i].id}?autoplay=1&playsinline=1`;
    yt.classList.add("show");
  },300);
}

videos.forEach((v,i)=>{
  const card=document.createElement("div");
  card.className="card";
  card.textContent=v.title;
  card.onclick=()=>{index=i;playVideo(i)};
  list.appendChild(card);
});

playVideo(0);


</script>

</body>
</html>
