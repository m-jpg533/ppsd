<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Shorts 科幻首頁</title>

<style>
body{
  margin:0;
  background:#000;
  font-family:"Microsoft JhengHei",sans-serif;
  color:#fff;
}

/* ===== 模式 ===== */
#modes{
  position:fixed;
  top:12px;
  right:12px;
  display:flex;
  gap:8px;
  z-index:1000;
}
#modes button{
  padding:6px 12px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.4);
  background:rgba(0,0,0,.5);
  color:#fff;
}

/* ===== Shorts 牆 ===== */
.shorts{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:14px;
  padding:16px;
}

.short{
  position:relative;
  border-radius:14px;
  overflow:hidden;
  cursor:pointer;
  transition:.3s;
}

.short img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.short.playing{
  animation:cardPulse 1.2s infinite;
}

@keyframes cardPulse{
  0%{box-shadow:0 0 0 rgba(0,255,255,0)}
  50%{box-shadow:0 0 28px rgba(0,255,255,.9)}
  100%{box-shadow:0 0 0 rgba(0,255,255,0)}
}

.playIcon{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:34px;
  background:rgba(0,0,0,.4);
}

/* ===== 播放器 ===== */
#playerBox{
  position:fixed;
  inset:0;
  background:#000;
  display:none;
  z-index:9999;
}

#player{
  width:100%;
  height:100%;
  border:none;
}

/* ===== 能量環 ===== */
.energy{
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:0;
  transition:opacity 1.2s ease;
}
.energy::before{
  content:"";
  position:absolute;
  inset:14px;
  border-radius:50%;
  border:6px solid transparent;
  animation:spin 6s linear infinite;
}
#playerBox.playing .energy{
  opacity:1;
}

/* ===== 音量條 ===== */
.volume{
  position:absolute;
  right:14px;
  top:50%;
  transform:translateY(-50%);
  display:flex;
  flex-direction:column;
  gap:6px;
  opacity:0;
  transition:opacity 1s;
}
#playerBox.playing .volume{
  opacity:1;
}
.bar{
  width:6px;
  height:10px;
  background:#0ff;
  border-radius:4px;
  animation:beat 1s infinite ease-in-out;
}
.bar:nth-child(2){animation-delay:.1s}
.bar:nth-child(3){animation-delay:.2s}
.bar:nth-child(4){animation-delay:.3s}
.bar:nth-child(5){animation-delay:.4s}

@keyframes beat{
  0%{height:10px;opacity:.4}
  50%{height:38px;opacity:1}
  100%{height:10px;opacity:.4}
}

/* ===== 模式顏色 ===== */
body.neon .energy::before{
  border-image:linear-gradient(45deg,#ff00ff,#ff66ff,#ff00ff) 1;
  box-shadow:0 0 60px #ff00ff;
}
body.heal .energy::before{
  border-image:linear-gradient(45deg,#7fffd4,#bfffe8,#7fffd4) 1;
  box-shadow:0 0 40px #7fffd4;
}
body.sci .energy::before{
  border-image:linear-gradient(45deg,#00ffff,#66ffff,#00ffff) 1;
  box-shadow:0 0 50px #00ffff;
}

@keyframes spin{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}

/* 關閉 */
.close{
  position:absolute;
  top:14px;
  right:14px;
  font-size:22px;
  background:rgba(0,0,0,.5);
  border-radius:50%;
  padding:6px 10px;
  cursor:pointer;
  z-index:10;
}
</style>
</head>

<body class="sci">

<div id="modes">
  <button onclick="setMode('neon')">霓虹</button>
  <button onclick="setMode('heal')">療癒</button>
  <button onclick="setMode('sci')">科幻</button>
</div>

<div class="shorts">
  <div class="short" onclick="playShort(this,'dUWjS74Qofw')">
    <img src="https://img.youtube.com/vi/dUWjS74Qofw/hqdefault.jpg">
    <div class="playIcon">▶</div>
  </div>
  <div class="short" onclick="playShort(this,'SJHE-7WNeHY')">
    <img src="https://img.youtube.com/vi/SJHE-7WNeHY/hqdefault.jpg">
    <div class="playIcon">▶</div>
  </div>
</div>

<div id="playerBox">
  <div class="energy"></div>

  <div class="volume">
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
  </div>

  <div class="close" onclick="closePlayer()">✕</div>
  <iframe id="player" allow="encrypted-media" playsinline webkit-playsinline></iframe>
</div>

<script>
const box = document.getElementById("playerBox");
const player = document.getElementById("player");
let currentCard=null;

function playShort(card,id){
  if(currentCard) currentCard.classList.remove("playing");
  card.classList.add("playing");
  currentCard=card;

  player.src=`https://www.youtube.com/embed/${id}?playsinline=1`;
  box.style.display="block";
  setTimeout(()=>box.classList.add("playing"),50);
}

function closePlayer(){
  box.classList.remove("playing");
  if(currentCard) currentCard.classList.remove("playing");
  setTimeout(()=>{
    player.src="";
    box.style.display="none";
  },1000);
}

function setMode(mode){
  document.body.className=mode;
}
</script>

</body>
</html>
