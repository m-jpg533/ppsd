<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Shorts 終極版</title>

<style>
body{
  margin:0;
  background:#000;
  font-family:"Microsoft JhengHei",sans-serif;
  overflow:hidden;
  transition:.4s;
}
body.neon{background:radial-gradient(circle,#220022,#000)}
body.heal{background:radial-gradient(circle,#0f2,#021)}
body.sci{background:radial-gradient(circle,#111,#000)}

#modes{
  position:fixed;
  top:12px;right:12px;
  display:flex;gap:6px;
  z-index:9999;
}
#modes button{
  padding:6px 12px;
  border-radius:20px;
  background:rgba(255,255,255,.15);
  color:#fff;
  border:none;
}

/* ===== Shorts 列表 ===== */
.shorts{
  height:100vh;
  overflow-y:auto;
  scroll-snap-type:y mandatory;
}
.short{
  height:100vh;
  scroll-snap-align:start;
  position:relative;
}
.short img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.short.playing{
  box-shadow:inset 0 0 90px cyan;
}
.playIcon{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:64px;
  color:#fff;
  background:rgba(0,0,0,.4);
}

/* ===== 播放器 ===== */
#playerBox{
  position:fixed;
  inset:0;
  background:#000;
  display:none;
  z-index:9998;
}
#player{
  width:100%;
  height:100%;
  border:none;
}

/* ===== 光環進度 ===== */
.ring{
  position:fixed;
  left:50%;top:50%;
  width:200px;height:200px;
  border-radius:50%;
  border:4px solid rgba(0,255,255,.6);
  transform:translate(-50%,-50%);
  animation:spin 6s linear infinite;
  pointer-events:none;
}
@keyframes spin{
  from{transform:translate(-50%,-50%) rotate(0)}
  to{transform:translate(-50%,-50%) rotate(360deg)}
}

/* ===== 音量動畫 ===== */
.volume{
  position:fixed;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  display:flex;
  flex-direction:column;
  gap:4px;
}
.volume span{
  width:6px;height:16px;
  background:#0ff;
  animation:vol 1s infinite;
}
.volume span:nth-child(2){animation-delay:.2s}
.volume span:nth-child(3){animation-delay:.4s}
@keyframes vol{
  0%,100%{opacity:.3}
  50%{opacity:1}
}
</style>
</head>

<body class="sci">

<div id="modes">
  <button onclick="setMode('neon')">霓虹</button>
  <button onclick="setMode('heal')">療癒</button>
  <button onclick="setMode('sci')">科幻</button>
</div>

<div class="shorts" id="shorts"></div>

<div id="playerBox">
  <iframe id="player" playsinline allow="encrypted-media"></iframe>
  <div class="ring"></div>
</div>

<div class="volume"><span></span><span></span><span></span></div>

<script>
const videos=[
 "jSaRUPIsDIA",
 "bKe8eohEfTQ",
 "6J6UyVgzERg",
 "L_jWHffIx5E",
 "kXYiU_JCYtU"
];

const shorts=document.getElementById("shorts");
const box=document.getElementById("playerBox");
const player=document.getElementById("player");
let index=0;

/* 建立 Shorts */
videos.forEach((id,i)=>{
  const s=document.createElement("div");
  s.className="short";
  s.dataset.i=i;
  s.innerHTML=`
    <img src="https://img.youtube.com/vi/${id}/hqdefault.jpg">
    <div class="playIcon">▶</div>
  `;
  s.onclick=()=>play(i);
  shorts.appendChild(s);
});

function play(i){
  index=i;
  document.querySelectorAll(".short").forEach(x=>x.classList.remove("playing"));
  shorts.children[i].classList.add("playing");
  player.src=`https://www.youtube.com/embed/${videos[i]}?playsinline=1`;
  box.style.display="block";
}

/* 左右滑切換 */
let startX=0;
box.addEventListener("touchstart",e=>startX=e.touches[0].clientX);
box.addEventListener("touchend",e=>{
  let dx=e.changedTouches[0].clientX-startX;
  if(dx>60 && index>0) play(index-1);
  if(dx<-60 && index<videos.length-1) play(index+1);
});

/* 關閉 */
box.onclick=()=>{
  player.src="";
  box.style.display="none";
};

/* 模式 */
function setMode(m){document.body.className=m}
</script>

</body>
</html>
