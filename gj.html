<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>科幻 Shorts 音樂首頁</title>

<style>
:root{
  --ring:#00ffff;
  --beat:1;
}

/* ===== 基本 ===== */
body{
  margin:0;
  background:#000;
  font-family:"Microsoft JhengHei",sans-serif;
  color:#fff;
  overflow-x:hidden;
}

/* ===== 模式切換 ===== */
#modes{
  position:fixed;
  top:12px;
  right:12px;
  display:flex;
  gap:8px;
  z-index:10000;
}
#modes button{
  padding:6px 12px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.4);
  background:rgba(0,0,0,.5);
  color:#fff;
  cursor:pointer;
}
body.neon{--ring:#ff00ff}
body.heal{--ring:#78ffc8}
body.sci {--ring:#00ffff}

/* ===== Shorts 卡片 ===== */
.shorts{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:14px;
  padding:16px;
}
.short{
  position:relative;
  border-radius:16px;
  overflow:hidden;
  cursor:pointer;
  transition:.2s;
}
.short img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.short.playing{
  box-shadow:0 0 30px var(--ring);
  animation:pulse 1s infinite;
}
@keyframes pulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.08)}
}
.playIcon{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:36px;
  background:rgba(0,0,0,.35);
}

/* ===== 播放舞台 ===== */
#playerBox{
  position:fixed;
  inset:0;
  background:#000;
  display:none;
  z-index:9999;
  overflow:hidden;
}
#player{
  width:100%;
  height:100%;
  border:none;
  z-index:5;
}

/* ===== 光環 ===== */
.ring{
  position:absolute;
  inset:-50px;
  border-radius:50%;
  z-index:2;
  background:
    radial-gradient(circle,
      rgba(255,255,255,.9) 0%,
      var(--ring) 35%,
      transparent 70%);
  box-shadow:
    0 0 40px var(--ring),
    0 0 100px var(--ring),
    0 0 200px var(--ring);
  transform:scale(calc(1 + var(--beat)*0.2));
  filter:brightness(calc(1 + var(--beat)*0.8));
  transition:.1s;
}

/* ===== 掃描探照燈 ===== */
.spot{
  position:absolute;
  width:200%;
  height:200%;
  top:-100%;
  left:-100%;
  mix-blend-mode:screen;
  opacity:.7;
  animation:scan 4s linear infinite;
}
.s1{background:conic-gradient(from 0deg, var(--ring), transparent 40%)}
.s2{background:conic-gradient(from 120deg, var(--ring), transparent 40%);animation-delay:-1s}
.s3{background:conic-gradient(from 240deg, var(--ring), transparent 40%);animation-delay:-2s}

@keyframes scan{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}

/* 關閉鍵 */
#closeBtn{
  position:absolute;
  top:16px;
  left:16px;
  z-index:10001;
  font-size:26px;
  background:none;
  border:none;
  color:#fff;
  cursor:pointer;
}
</style>
</head>

<body class="sci">

<!-- 模式 -->
<div id="modes">
  <button onclick="setMode('neon')">霓虹</button>
  <button onclick="setMode('heal')">療癒</button>
  <button onclick="setMode('sci')">科幻</button>
</div>

<!-- Shorts -->
<div class="shorts">
  <div class="short" data-id="jSaRUPIsDIA">
    <img src="https://img.youtube.com/vi/jSaRUPIsDIA/hqdefault.jpg">
    <div class="playIcon">▶</div>
  </div>
  <div class="short" data-id="bKe8eohEfTQ">
    <img src="https://img.youtube.com/vi/bKe8eohEfTQ/hqdefault.jpg">
    <div class="playIcon">▶</div>
  </div>
</div>

<!-- 播放器 -->
<div id="playerBox">
  <button id="closeBtn" onclick="closePlayer()">✕</button>
  <iframe id="player" allow="autoplay; encrypted-media" playsinline></iframe>
  <div class="ring"></div>
  <div class="spot s1"></div>
  <div class="spot s2"></div>
  <div class="spot s3"></div>
</div>

<script>
let playing=false;
let current=null;

/* 假節奏 */
setInterval(()=>{
  if(!playing) return;
  const beat=(Math.sin(Date.now()/120)+1)/2;
  document.documentElement.style.setProperty("--beat",beat);
  document.querySelectorAll(".spot").forEach(s=>{
    s.style.animationDuration=(4-beat*2)+"s";
  });
},60);

/* 播放 */
function play(id,card){
  const box=document.getElementById("playerBox");
  const player=document.getElementById("player");
  player.src=`https://www.youtube.com/embed/${id}?playsinline=1`;
  box.style.display="block";
  playing=true;
  if(current) current.classList.remove("playing");
  current=card;
  card.classList.add("playing");
}

/* 關閉 */
function closePlayer(){
  document.getElementById("player").src="";
  document.getElementById("playerBox").style.display="none";
  playing=false;
  if(current) current.classList.remove("playing");
}

/* 模式 */
function setMode(m){
  document.body.className=m;
}

/* 綁定 */
document.querySelectorAll(".short").forEach(s=>{
  s.onclick=()=>play(s.dataset.id,s);
});
</script>

</body>
</html>
